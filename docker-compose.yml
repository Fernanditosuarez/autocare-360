services:
  version: '3.8'

  services:
    postgres:
      image: postgres:16-alpine
      container_name: autocare360-db
      environment:
        POSTGRES_DB: autocare360
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data: